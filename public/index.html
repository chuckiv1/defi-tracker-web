PID = localStorage.getItem('dv_pid') || null;

function normUi(){
  if(["active","past","detail","frf","frf_pos","looping","admin","community"].indexOf(V)===-1)V="active";
  if(VW!=="grid"&&VW!=="list")VW="grid";
  if(FRFV!=="open"&&FRFV!=="closed")FRFV="open";
  if(["size","az","za","apr","runtime"].indexOf(STRAT_SORT)===-1)STRAT_SORT="size";
  if(["size","az","za","apr","runtime"].indexOf(FRF_SORT)===-1)FRF_SORT="size";
  if(!EXP||typeof EXP!=="object")EXP={};
  if(V==="detail"&&(!SI||!S.find(x=>x.id===SI))){SI=null;V="active"}
  if(V==="looping"&&(!PID||IS_DEMO)){V="active"}
  if(V==="frf_pos"&&(!FPI||!FR.positions.find(x=>x.id===FPI))){FPI=null;V="frf"}
}

function tgl(k){EXP[k]=!EXP[k];R()}
function fd(i){if(!i)return"—";var d=new Date(i);return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
function fds(i){if(!i)return"";return new Date(i).toISOString().slice(0,10)}
function fts(i){if(!i)return"";return new Date(i).toTimeString().slice(0,5)}
function db(a,b){return Math.max(0,(new Date(b)-new Date(a))/864e5)}
function calcApr(g,i,d){return(!i||d<.001)?0:((g/i)/d)*365*100}
function fn(n){return (n||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fpr(n){if(!n)return"0";var s=String(n),d=s.indexOf(".");if(d<0)return fn(n);var dc=s.length-d-1;return n.toLocaleString("de-DE",{minimumFractionDigits:Math.max(2,dc),maximumFractionDigits:Math.max(2,dc)})}
function es(s){return String(s||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

function ci(s){var h=s.investmentHistory;return h&&h.length?h[h.length-1].amount:0}
function tr(s){return s.rewards.reduce((a,r)=>a+r.amount,0)}
function posFloatingPnl(p){
  if(p.endedAt||p.type!=='hedge')return 0;
  if(!p.token)return 0;
  var pr=p.useManualPrice?p.manualPrice:PRICES[p.token.toUpperCase()];
  if(!pr||!p.tokenAmount)return 0;
  var f=0;
  if(p.shortExchangeId&&p.entryPriceShort)f+=(p.entryPriceShort-pr)*p.tokenAmount;
  if(p.longExchangeId&&p.entryPriceLong)f+=(pr-p.entryPriceLong)*p.tokenAmount;
  return f;
}
function posPnl(p){return latestFunding(p.fundingShort)+latestFunding(p.fundingLong)+(p.closePnlShort||0)+(p.closePnlLong||0)+posFloatingPnl(p)}
function tp(s,ia){var pnl=(s.pnl||[]).reduce((a,p)=>ia?(p.includeInAPR?a+p.amount:a):a+p.amount,0);var lnk=FR.positions.filter(x=>x.linkedStrategyId===s.id&&x.includeInStrategy&&x.type==='hedge');var hp=lnk.reduce((a,x)=>a+posPnl(x),0);return pnl+hp}
function tg(s){return tr(s)+tp(s,true)}
function bp(s,e){
  var h=s.investmentHistory.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  var vp=(s.pnl||[]).slice();
  var lnk=FR.positions.filter(x=>x.linkedStrategyId===s.id&&x.includeInStrategy&&x.type==='hedge');
  lnk.forEach(x=>{var d=x.endedAt||new Date().toISOString();vp.push({amount:posPnl(x),date:d,includeInAPR:true})});
  var ps=[];
  for(var i=0;i<h.length;i++){
    var st=h[i].date,en=(i<h.length-1)?h[i+1].date:e;
    var dy=db(st,en);
    var rw=s.rewards.filter(r=>{var rd=new Date(r.date).getTime(),sd=new Date(st).getTime(),ed=new Date(en).getTime();return rd>=sd&&(i<h.length-1?rd<ed:rd<=ed)});
    var pl=vp.filter(p=>{if(!p.includeInAPR)return false;var pd=new Date(p.date).getTime(),sd=new Date(st).getTime(),ed=new Date(en).getTime();return pd>=sd&&(i<h.length-1?pd<ed:pd<=ed)});
    var rs=rw.reduce((a,r)=>a+r.amount,0),pls=pl.reduce((a,p)=>a+p.amount,0),gs=rs+pls,ap=calcApr(gs,h[i].amount,dy);
    var pv=i>0?h[i-1].amount:null,ch=pv!==null?h[i].amount-pv:null;
    ps.push({id:h[i].id,amount:h[i].amount,date:h[i].date,endDate:en,days:dy,rewards:rs,pnl:pls,gains:gs,apr:ap,change:ch,isCurrent:i===h.length-1,note:h[i].note||""})
  }
  return ps
}
function wa(s,e){var ps=bp(s,e),tw=0,td=0;ps.forEach(p=>{tw+=p.apr*p.amount*p.days;td+=p.amount*p.days});return td>0?tw/td:0}
function stratIncl(s){return s.includeInTotalApr!==false}
function sortStrategies(arr,isPast){var xs=arr.slice(),now=new Date().toISOString();xs.sort((a,b)=>{var av=0,bv=0,an=(a.name||"").toLowerCase(),bn=(b.name||"").toLowerCase();if(STRAT_SORT==="az")return an.localeCompare(bn,"de");if(STRAT_SORT==="za")return bn.localeCompare(an,"de");if(STRAT_SORT==="apr"){av=wa(a,isPast?(a.endedAt||now):now);bv=wa(b,isPast?(b.endedAt||now):now);if(bv!==av)return bv-av;return an.localeCompare(bn,"de")}if(STRAT_SORT==="runtime"){av=db(a.startDate,isPast?(a.endedAt||now):now);bv=db(b.startDate,isPast?(b.endedAt||now):now);if(bv!==av)return bv-av;return an.localeCompare(bn,"de")}av=ci(a);bv=ci(b);if(bv!==av)return bv-av;return an.localeCompare(bn,"de")});return xs}
function frfAprForSort(p){var end=p.endedAt||new Date().toISOString(),dur=db(p.startDate,end),cap=posCapital(p),pnl=posPnl(p);return calcApr(pnl-(p.fees||0),cap,dur)}
function frfTotalApr(arr){var totalCap=0,totalWeighted=0;(arr||[]).forEach(p=>{if(!posIncl(p))return;var cap=posCapital(p),apr=frfAprForSort(p);if(cap>0&&isFinite(apr)){totalCap+=cap;totalWeighted+=apr*cap}});return totalCap>0?totalWeighted/totalCap:0}
function sortFrf(arr){var xs=arr.slice();xs.sort((a,b)=>{var av=0,bv=0,an=(a.token||"").toLowerCase(),bn=(b.token||"").toLowerCase();if(FRF_SORT==="az")return an.localeCompare(bn,"de");if(FRF_SORT==="za")return bn.localeCompare(an,"de");if(FRF_SORT==="apr"){av=frfAprForSort(a);bv=frfAprForSort(b);if(bv!==av)return bv-av;return an.localeCompare(bn,"de")}if(FRF_SORT==="runtime"){av=db(a.startDate,a.endedAt||new Date().toISOString());bv=db(b.startDate,b.endedAt||new Date().toISOString());if(bv!==av)return bv-av;return an.localeCompare(bn,"de")}av=posLiveSize(a);bv=posLiveSize(b);if(bv!==av)return bv-av;return an.localeCompare(bn,"de")});return xs}
function exMargin(ex){return ex.marginHistory.reduce((a,m)=>a+m.amount,0)}
function exName(id){var e=FR.exchanges.find(x=>x.id===id);return e?e.name:"Spot"}
function latestFunding(arr){return arr&&arr.length?arr[arr.length-1].amount:0}
function posIncl(p){return p.excluded!==true}
function runningFunding(p){return latestFunding(p.fundingShort)+latestFunding(p.fundingLong)+posFloatingPnl(p)}
function posLiveSize(p){if(p.useManualPrice&&p.manualPrice)return p.tokenAmount*p.manualPrice;var pr=PRICES[p.token?p.token.toUpperCase():""];if(pr&&p.tokenAmount)return p.tokenAmount*pr;if(p.tokenAmount&&(p.entryPriceShort||p.entryPriceLong)){var ep=(p.entryPriceShort&&p.entryPriceLong)?(p.entryPriceShort+p.entryPriceLong)/2:(p.entryPriceShort||p.entryPriceLong);return p.tokenAmount*ep}return p.positionSizeUsd||0}
function posEntrySize(p){var ep=(p.entryPriceShort&&p.entryPriceLong)?(p.entryPriceShort+p.entryPriceLong)/2:(p.entryPriceShort||p.entryPriceLong||0);return p.tokenAmount?p.tokenAmount*ep:p.positionSizeUsd||0}
function posCapital(p){if(p.longIsSpot)return posEntrySize(p)||p.positionSizeUsd||1;var se=FR.exchanges.find(x=>x.id===p.shortExchangeId);var le=FR.exchanges.find(x=>x.id===p.longExchangeId);var cap=0;if(se){var sm=exMargin(se);var sPos=FR.positions.filter(x=>!x.endedAt&&(x.shortExchangeId===se.id||(!x.longIsSpot&&x.longExchangeId===se.id)));var sTotal=sPos.reduce((a,x)=>a+posLiveSize(x),0);if(sTotal>0)cap+=sm*(posLiveSize(p)/sTotal)}if(le&&!p.longIsSpot){var lm=exMargin(le);var lPos=FR.positions.filter(x=>!x.endedAt&&(x.shortExchangeId===le.id||(!x.longIsSpot&&x.longExchangeId===le.id)));var lTotal=lPos.reduce((a,x)=>a+posLiveSize(x),0);if(lTotal>0)cap+=lm*(posLiveSize(p)/lTotal)}return cap||posEntrySize(p)||p.positionSizeUsd||1}

function fetchPrices(){
  var tokens={};FR.positions.forEach(p=>{if(!p.endedAt&&p.token){var id=CG_REV[p.token.toUpperCase()]||p.coingeckoId;if(id)tokens[p.token.toUpperCase()]=id}});
  var ids=Object.values(tokens);if(!ids.length)return;
  fetch("https://api.coingecko.com/api/v3/simple/price?ids="+ids.join(",")+"&vs_currencies=usd").then(r=>r.json()).then(d=>{
    for(var sym in tokens){var cgId=tokens[sym];if(d[cgId]&&d[cgId].usd)PRICES[sym]=d[cgId].usd}
    R();
  }).catch(()=>{});
}

function api(url, opts={}) {
  if (IS_DEMO && opts.method && opts.method.toUpperCase() !== 'GET' && !url.includes('/api/auth')) {
    return Promise.reject(new Error("demo_blocked"));
  }

  opts.headers = opts.headers || {};
  opts.headers['Content-Type'] = 'application/json';
  if(PID) opts.headers['x-profile-id'] = PID;
  return fetch(url, opts).then(r => {
    return r.text().then(text => {
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error("Fehlerhafte Server-Antwort."); }
      if(r.status === 401) { AUTH.loggedIn = false; R(); throw new Error("auth"); }
      if(r.status === 403) { alert(data.error || "Zugriff verweigert"); throw new Error("auth"); }
      return {status: r.status, data};
    });
  });
}

function F(u, o={}) {
  if (IS_DEMO && o.method && o.method.toUpperCase() !== 'GET' && !u.includes('/api/auth')) {
    return Promise.reject(new Error("demo_blocked"));
  }

  o.headers = o.headers || {};
  o.headers['Content-Type'] = 'application/json';
  if(PID) o.headers['x-profile-id'] = PID;
  return fetch(u, o).then(r => {
    if(r.status===401) { AUTH.loggedIn = false; R(); throw new Error("auth"); }
    if(r.status===403) { alert("Zugriff verweigert"); throw new Error("auth"); }
    return r.json();
  });
}

function renderAdminChart() {
  if(!M.adet || !document.getElementById('admin-chart')) return;
  var cvs = document.getElementById('admin-chart'), ctx = cvs.getContext('2d');
  cvs.width = cvs.offsetWidth * 2; cvs.height = cvs.offsetHeight * 2; ctx.scale(2,2);
  var w = cvs.offsetWidth, h = cvs.offsetHeight;
  ctx.clearRect(0,0,w,h);
  
  var tf = M.adet.tf, stats = M.adet.stats;
  var counts = [], labels = [], maxC = 0, now = Date.now();
  for(var i=tf-1; i>=0; i--) {
    let dObj = new Date(now - i*864e5);
    let dStr = dObj.toISOString().split('T')[0];
    let lbl = dObj.getDate().toString().padStart(2,'0')+'.'+(dObj.getMonth()+1).toString().padStart(2,'0')+'.';
    let c = stats.filter(s => s.startsWith(dStr)).length;
    counts.push(c);
    labels.push(lbl);
    if(c > maxC) maxC = c;
  }
  
  if(maxC === 0) {
    ctx.fillStyle = '#8a8f98'; ctx.font = '12px "Inter", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText("Keine Aktivität in diesem Zeitraum", w/2, h/2);
    return;
  }
  
  var barW = (w / tf) - 4; if(barW < 4) barW = 4;
  var bottomPadding = 24, topPadding = 20;
  var maxH = h - bottomPadding - topPadding;

  counts.forEach((c, idx) => {
    var bx = idx * (w / tf) + 2;
    var rawBh = (c / maxC) * maxH;
    var bh = c === 0 ? 0 : Math.max(4, rawBh);
    var by = h - bottomPadding - bh;
    
    // Bar
    ctx.fillStyle = c > 0 ? '#00e5a0' : '#2a2f3a';
    if(c===0) { ctx.fillRect(bx, h - bottomPadding - 4, barW, 4); } 
    else { ctx.fillRect(bx, by, barW, bh); }

    // Count text inside/above bar
    if(c > 0 && barW > 14) {
      ctx.fillStyle = (bh > 20) ? '#0d0f14' : '#00e5a0';
      ctx.font = '600 10px "JetBrains Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let ty = (bh > 20) ? by + 10 : by - 8;
      ctx.fillText(c.toString(), bx + barW/2, ty);
    }
    
    // X-Axis Date (only show if enough space or every Nth label)
    if (barW > 24 || (idx % Math.ceil(tf/7) === 0)) {
       ctx.fillStyle = '#6b7280'; ctx.font = '10px "Inter", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
       ctx.fillText(labels[idx], bx + barW/2, h - bottomPadding + 6);
    }
  });
}
