services:
  app:
    build: .
    restart: always
    # Nur lokal gebunden; oeffentlich erreichbar allein ueber den
    # nginx-vhost davor, so wie die uebrigen Dienste auf dem Server.
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER fehlt in der .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB fehlt in der .env}
      # Leer = normale Anmeldung. Gesetzt = offener Betrieb als dieses Konto.
      - OPEN_ACCESS_ACCOUNT_ID=${OPEN_ACCESS_ACCOUNT_ID:-}

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      # Ohne Default: ein ratbares Fallback-Passwort ist schlimmer als ein
      # Start, der auffaellt.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in der .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in der .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: PostgreSQL nur intern erreichbar, kein externer Port-Expose
    # ports:
    #   - "5432:5432"

volumes:
  postgres_data:
