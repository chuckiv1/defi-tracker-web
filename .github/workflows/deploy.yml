name: Deploy
on:
  push:
    branches: [ master ]

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (attempt 1)
        id: deploy_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.124.163.90
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            cd /root/defi-tracker-web
            git pull --ff-only
            docker compose pull db
            if ! docker compose up -d --build --remove-orphans; then
              echo "docker compose failed, retrying once after cleanup"
              docker compose rm -sf app || true
              docker rm -f defi-tracker-web-app-1 || true
              sleep 3
              docker compose up -d --build --remove-orphans
            fi

      - name: Deploy via SSH (attempt 2)
        id: deploy_2
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.124.163.90
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            cd /root/defi-tracker-web
            git pull --ff-only
            docker compose pull db
            if ! docker compose up -d --build --remove-orphans; then
              echo "docker compose failed, retrying once after cleanup"
              docker compose rm -sf app || true
              docker rm -f defi-tracker-web-app-1 || true
              sleep 3
              docker compose up -d --build --remove-orphans
            fi

      - name: Deploy via SSH (attempt 3)
        id: deploy_3
        if: ${{ steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.124.163.90
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            cd /root/defi-tracker-web
            git pull --ff-only
            docker compose pull db
            if ! docker compose up -d --build --remove-orphans; then
              echo "docker compose failed, retrying once after cleanup"
              docker compose rm -sf app || true
              docker rm -f defi-tracker-web-app-1 || true
              sleep 3
              docker compose up -d --build --remove-orphans
            fi

      - name: Mark deploy as failed after 3 attempts
        if: ${{ steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure' }}
        run: exit 1
